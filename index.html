<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 SIKARI ESPORTS - 1v1 CS CUSTOM TOURNAMENT 🔥</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background: #050508;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    /* Cyberpunk Gaming Grid Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 50% 30%, rgba(255, 0, 102, 0.25), transparent 70%),
        linear-gradient(to bottom, rgba(10, 10, 15, 0.8), rgba(5, 5, 8, 0.95)),
        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
      z-index: -1;
      filter: brightness(0.7);
    }

    /* Hero Logo Section with Fire Glow */
    .hero {
      text-align: center;
      margin-bottom: 20px;
      animation: fadeInDown 1s ease-out;
    }

    .logo-frame {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
    }

    .logo-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3.5px solid #ff0066;
      box-shadow: 0 0 30px #ff0066, inset 0 0 15px #ff0066;
      object-fit: cover;
      animation: logoGlow 2s infinite alternate;
    }

    @keyframes logoGlow {
      0% { box-shadow: 0 0 15px #ff0066; transform: scale(1); }
      100% { box-shadow: 0 0 40px #ff0066, 0 0 60px #ff5500; transform: scale(1.05); }
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 12px #ff0066, 0 0 25px #ff0066;
    }

    .sub-title {
      font-size: 1.2rem;
      color: #ffcc00;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* Tournament Banner Cards (1v1, Prize, Entry) */
    .match-info-grid {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
    }

    .info-card {
      flex: 1;
      background: rgba(20, 20, 30, 0.85);
      border: 1.5px solid #ff0066;
      border-radius: 10px;
      padding: 10px 5px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.2);
    }

    .info-card i {
      font-size: 1.2rem;
      color: #ff0066;
      margin-bottom: 4px;
    }

    .info-card .label {
      font-size: 0.75rem;
      color: #aaa;
      font-weight: 700;
      text-transform: uppercase;
    }

    .info-card .val {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: #00ff66;
    }

    /* Form Container */
    .card-box {
      background: rgba(15, 15, 22, 0.9);
      border: 2px solid rgba(255, 0, 102, 0.6);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      box-shadow: 0 0 35px rgba(255, 0, 102, 0.3);
      backdrop-filter: blur(10px);
      animation: fadeInUp 1s ease-out;
    }

    /* Input Field Styling */
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #ccc;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: #ff0066;
      font-size: 1.1rem;
    }

    .input-field {
      width: 100%;
      padding: 12px 15px 12px 45px;
      background: #09090f;
      border: 1.5px solid #2a2a3a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #ff0066;
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.5);
    }

    /* Action Buttons */
    .btn-main {
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, #ff0066, #ff5500);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 102, 0.6);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 0, 102, 0.9);
    }

    /* QR Box */
    .qr-box {
      display: none;
      text-align: center;
      animation: zoomIn 0.5s ease;
    }

    .qr-frame {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      border: 3.5px solid #ff0066;
      box-shadow: 0 0 25px rgba(255, 0, 102, 0.7);
      margin: 15px 0;
    }

    .qr-frame img {
      width: 200px;
      height: 200px;
      display: block;
    }

    /* Insta Box */
    .insta-box {
      display: none;
      text-align: center;
      animation: zoomIn 0.5s ease;
    }

    .btn-insta {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 20px rgba(220, 39, 67, 0.6);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-insta:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(220, 39, 67, 0.9);
    }

    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="bg-animation"></div>

  <!-- Header / Logo Section -->
  <div class="hero">
    <div class="logo-frame">
      <!-- Aapke Logo ki Image Path -->
      <img src="ae2836a1-e747-4020-b10b-5a6fe78c5dbf.png" alt="Sikari Esports Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/130/ff0066/ffffff?text=SIKARI'">
    </div>
    <h1 class="main-title">SIKARI ESPORTS</h1>
    <p class="sub-title">⚔️ Free Fire 1v1 CS Custom ⚔️</p>
  </div>

  <!-- Highlights Banner Cards -->
  <div class="match-info-grid">
    <div class="info-card">
      <i class="fa-solid fa-crosshairs"></i>
      <div class="label">MODE</div>
      <div class="val" style="color:#ff0066;">1 v 1 CS</div>
    </div>
    <div class="info-card">
      <i class="fa-solid fa-trophy"></i>
      <div class="label">WIN PRIZE</div>
      <div class="val">₹55</div>
    </div>
    <div class="info-card">
      <i class="fa-solid fa-ticket"></i>
      <div class="label">ENTRY FEE</div>
      <div class="val" style="color:#ffcc00;">₹30</div>
    </div>
  </div>

  <!-- Registration / Payment Card -->
  <div class="card-box">

    <!-- STEP 1: Registration Form -->
    <div id="formSection">
      <div class="input-group">
        <label for="name"><i class="fa-solid fa-user-ninja"></i> GAME NAME</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-gamepad"></i>
          <input type="text" id="name" class="input-field" placeholder="In-Game Name..." required>
        </div>
      </div>

      <div class="input-group">
        <label for="uid"><i class="fa-solid fa-hashtag"></i> FREE FIRE UID</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-id-card"></i>
          <input type="number" id="uid" class="input-field" placeholder="10-Digit Game UID..." required>
        </div>
      </div>

      <div class="input-group">
        <label for="insta"><label for="insta"><i class="fa-brands fa-instagram"></i> INSTAGRAM USERNAME</label></label>
        <div class="input-wrapper">
          <i class="fa-brands fa-instagram"></i>
          <input type="text" id="insta" class="input-field" placeholder="@your_instagram_id" required>
        </div>
      </div>

      <button class="btn-main" onclick="goToPayment()">
        PROCEED TO PAY ₹30 <i class="fa-solid fa-bolt"></i>
      </button>
    </div>

    <!-- STEP 2: Payment QR Code Section -->
    <div class="qr-box" id="qrSection">
      <h2 style="font-family: 'Orbitron'; color: #ffcc00; font-size: 1.3rem;">SCAN & PAY ₹30</h2>
      <p style="color: #aaa; font-size: 0.9rem; margin-top: 5px;">Winning Prize: <b style="color:#00ff66;">₹55 CASH</b></p>
      
      <div class="qr-frame">
        <!-- Aapka Payment QR Code -->
        <img src="qr.png" alt="Payment QR Code" onerror="this.src='https://via.placeholder.com/200/000000/ffffff?text=Scan+QR+Code'">
      </div>

      <button class="btn-main" onclick="paymentDone()" style="background: linear-gradient(45deg, #00b09b, #96c93d);">
        <i class="fa-solid fa-circle-check"></i> PAYMENT COMPLETED
      </button>
    </div>

    <!-- STEP 3: Instagram Verification Section -->
    <div class="insta-box" id="instaSection">
      <i class="fa-solid fa-shield-halved" style="font-size: 3.2rem; color: #00ff66; margin-bottom: 12px;"></i>
      <h2 style="font-family: 'Orbitron'; font-size: 1.4rem; color: #fff;">LAST STEP!</h2>
      <p style="color: #ddd; margin: 12px 0; font-size: 0.95rem; line-height: 1.4;">
        Payment complete karne ke baad **Payment Screenshot** Instagram par DM karein taaki aapka **Room ID & Password** mil sake!
      </p>

      <!-- Apna Instagram Link Yahan Replace Karein -->
      <a href="https://instagram.com/YOUR_ESPORT_ID" target="_blank" class="btn-insta">
        <i class="fa-brands fa-instagram" style="font-size: 1.4rem;"></i> SEND SCREENSHOT ON INSTA
      </a>
    </div>

  </div>

  <script>
    function goToPayment() {
      const name = document.getElementById("name").value.trim();
      const uid = document.getElementById("uid").value.trim();
      const insta = document.getElementById("insta").value.trim();

      if (!name || !uid || !insta) {
        alert("Kripya Game Name, UID aur Insta Account saare details bharein!");
        return;
      }

      document.getElementById("formSection").style.display = "none";
      document.getElementById("qrSection").style.display = "block";
    }

    function paymentDone() {
      document.getElementById("qrSection").style.display = "none";
      document.getElementById("instaSection").style.display = "block";
    }
  </script>

</body>
</html>
