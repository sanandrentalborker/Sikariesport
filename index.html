<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 SIKARI ESPORTS - 1v1 CS Tournament 🔥</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background: #08080c;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    /* Animated Grid Background Effect */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(255, 0, 102, 0.05), rgba(0, 0, 0, 0.95)),
                  radial-gradient(circle, rgba(255, 0, 102, 0.15) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px;
      z-index: -1;
      animation: pulseGrid 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGrid {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Hero & Logo Section Animation */
    .hero {
      text-align: center;
      animation: fadeInDown 1.2s ease-out;
      margin-bottom: 25px;
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
    }

    .logo-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #ff0066;
      box-shadow: 0 0 25px #ff0066, inset 0 0 15px #ff0066;
      animation: logoGlow 2s infinite alternate;
      object-fit: cover;
    }

    @keyframes logoGlow {
      0% { box-shadow: 0 0 15px #ff0066; transform: scale(1); }
      100% { box-shadow: 0 0 35px #ff0066, 0 0 50px #ff0066; transform: scale(1.05); }
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
    }

    .sub-title {
      font-size: 1.1rem;
      color: #ffcc00;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 5px;
      text-transform: uppercase;
    }

    /* Glassmorphism Card Container */
    .card-container {
      background: rgba(18, 18, 26, 0.85);
      border: 2px solid rgba(255, 0, 102, 0.5);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(255, 0, 102, 0.25);
      animation: fadeInUp 1s ease-out;
      position: relative;
    }

    /* Input Field Styling */
    .input-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      color: #bbb;
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 15px;
      color: #ff0066;
      font-size: 1.2rem;
    }

    .input-field {
      width: 100%;
      padding: 12px 15px 12px 45px;
      background: #0d0d14;
      border: 1.5px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #ff0066;
      box-shadow: 0 0 12px rgba(255, 0, 102, 0.4);
    }

    /* Custom Gaming Button */
    .btn-action {
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, #ff0066, #ff5500);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.5);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 0, 102, 0.8);
    }

    /* QR Code Section */
    .qr-box {
      display: none;
      text-align: center;
      animation: zoomIn 0.5s ease;
    }

    .qr-box h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      color: #ffcc00;
      margin-bottom: 10px;
    }

    .qr-wrapper {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      border: 3px solid #ff0066;
      box-shadow: 0 0 20px rgba(255, 0, 102, 0.6);
      margin: 15px 0;
    }

    .qr-wrapper img {
      width: 190px;
      height: 190px;
      display: block;
    }

    .fee-badge {
      background: rgba(255, 0, 102, 0.2);
      border: 1px solid #ff0066;
      color: #fff;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 15px;
      display: inline-block;
    }

    /* Instagram Action Box */
    .insta-box {
      display: none;
      text-align: center;
      animation: zoomIn 0.5s ease;
    }

    .insta-box p {
      font-size: 1rem;
      color: #ddd;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .btn-insta {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 15px rgba(220, 39, 67, 0.5);
      transition: all 0.3s ease;
    }

    .btn-insta:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(220, 39, 67, 0.8);
    }

    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <!-- Hero / Header Section -->
  <div class="hero">
    <div class="logo-container">
      <!-- Aapka Logo Image Link -->
      <img src="logo.png" alt="Sikari Esports Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/120/ff0066/ffffff?text=SIKARI'">
    </div>
    <h1 class="main-title">SIKARI ESPORTS</h1>
    <p class="sub-title">⚡ 1v1 CS Custom Match Registration ⚡</p>
  </div>

  <!-- Main Interaction Card -->
  <div class="card-container">

    <!-- STEP 1: Registration Form -->
    <div id="formSection">
      <div class="input-group">
        <label for="name">FREE FIRE IN-GAME NAME</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-gamepad"></i>
          <input type="text" id="name" class="input-field" placeholder="e.g. SIKARI_GAMER" required>
        </div>
      </div>

      <div class="input-group">
        <label for="uid">FREE FIRE UID</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-id-card"></i>
          <input type="number" id="uid" class="input-field" placeholder="e.g. 1234567890" required>
        </div>
      </div>

      <div class="input-group">
        <label for="insta">INSTAGRAM USERNAME</label>
        <div class="input-wrapper">
          <i class="fa-brands fa-instagram"></i>
          <input type="text" id="insta" class="input-field" placeholder="@your_instagram_id" required>
        </div>
      </div>

      <button class="btn-action" onclick="goToPayment()">
        PROCEED TO PAYMENT <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- STEP 2: Payment QR Section -->
    <div class="qr-box" id="qrSection">
      <h2>SCAN & PAY ENTRY FEE</h2>
      <div class="fee-badge">Entry Fee: ₹30 ONLY</div>
      <div>
        <div class="qr-wrapper">
          <!-- Aapka QR Code Image Link -->
          <img src="qr.png" alt="Payment QR Code" onerror="this.src='https://via.placeholder.com/200/000000/ffffff?text=QR+Code'">
        </div>
      </div>
      <button class="btn-action" onclick="paymentComplete()" style="background: linear-gradient(45deg, #00b09b, #96c93d);">
        <i class="fa-solid fa-circle-check"></i> PAYMENT COMPLETE
      </button>
    </div>

    <!-- STEP 3: Instagram Screenshot Verification -->
    <div class="insta-box" id="instaSection">
      <i class="fa-solid fa-circle-check" style="font-size: 3rem; color: #00ff66; margin-bottom: 10px;"></i>
      <h2 style="color: #fff; font-family: 'Orbitron'; margin-bottom: 10px;">FINAL STEP!</h2>
      <p>Payment complete karne ke baad **Payment Ka Screenshot** hamare Instagram par DM karo room ID & Password paane ke liye!</p>

      <!-- Apna Instagram Username/Link Yahan Replace Karein -->
      <a href="https://instagram.com/YOUR_ESPORT_ID" target="_blank" class="btn-insta">
        <i class="fa-brands fa-instagram" style="font-size: 1.4rem;"></i> SEND SCREENSHOT NOW
      </a>
    </div>

  </div>

  <script>
    function goToPayment() {
      const name = document.getElementById("name").value.trim();
      const uid = document.getElementById("uid").value.trim();
      const insta = document.getElementById("insta").value.trim();

      if (!name || !uid || !insta) {
        alert("Kripya saari details (Name, UID, Insta ID) dhyan se bhare!");
        return;
      }

      document.getElementById("formSection").style.display = "none";
      document.getElementById("qrSection").style.display = "block";
    }

    function paymentComplete() {
      document.getElementById("qrSection").style.display = "none";
      document.getElementById("instaSection").style.display = "block";
    }
  </script>

</body>
</html>
